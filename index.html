    <style>
        .ql-toolbar.ql-snow { padding: 4px !important; border-radius: 12px 12px 0 0; }
        .ql-container.ql-snow { border-radius: 0 0 12px 12px; }
        .sortable-ghost { opacity: 0.4; border: 2px dashed #3b82f6; }
.ql-toolbar button svg{
    transition:.2s;
}

.ql-toolbar button:hover svg{
    transform:scale(1.15);
}

.ql-toolbar .ql-bold svg{
    color:#2563eb;
}

.ql-toolbar .ql-italic svg{
    color:#9333ea;
}

.ql-toolbar .ql-underline svg{
    color:#16a34a;
}

.ql-toolbar .ql-strike svg{
    color:#dc2626;
}

.ql-toolbar .ql-link svg{
    color:#0891b2;
}

.ql-toolbar .ql-size{
    color:#f59e0b;
}

.ql-toolbar .ql-color svg,
.ql-toolbar .ql-background svg{
    color:#ec4899;
}

.ql-toolbar button:hover{
    background:#f3f4f6;
    border-radius:8px;
}
.ql-editor .colored-icon {
    display:inline-block;
    padding:0 4px;
    cursor:pointer;
}

.icon-scroll {
    max-height:60vh;
    overflow-y:auto;
    scrollbar-width:thin;
}

.icon-scroll::-webkit-scrollbar {
    width:6px;
}

.icon-scroll::-webkit-scrollbar-thumb {
    background:#cbd5e1;
    border-radius:10px;
}

[title]:hover::after {
    content:attr(title);
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    background:#333;
    color:#fff;
    padding:4px 8px;
    border-radius:4px;
    font-size:10px;
    white-space:nowrap;
    z-index:100;
}
/*==========================
    OneNote File Attachment
==========================*/

.onenote-file-blot {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    margin: 4px;
    max-width: 260px;
}

.onenote-file-blot:hover{
    background:#e5e7eb;
}

.onenote-file-icon{
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.onenote-file-info{
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.onenote-file-name{
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.onenote-file-size{
    font-size:11px;
    color:#6b7280;
}

/*================ GLASS LỊCH ÂM DƯƠNG ================*/

/* Nền phủ modal */
#calendarModal{
    background:
    linear-gradient(
        135deg,
        rgba(59,130,246,.18),
        rgba(236,72,153,.18),
        rgba(34,211,238,.18)
    );

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}


/* Khung lịch chính */
.calendar-glass{

    background:
    rgba(255,255,255,.25);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:
    1px solid rgba(255,255,255,.45);

    border-radius:26px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.18),
    inset 0 0 30px rgba(255,255,255,.25);

    animation:
    calendarShow .35s ease;

}


/* Tiêu đề tháng */
.calendar-header{

    background:
    linear-gradient(
        135deg,
        rgba(239,68,68,.18),
        rgba(59,130,246,.18)
    );

    backdrop-filter:blur(12px);

    border-radius:18px;

    padding:12px;

}


/* Lưới ngày */
#calendarGrid{
    gap:8px;
}


/* Ô ngày */
.calendar-day{

    background:
    rgba(255,255,255,.22);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border:
    1px solid rgba(255,255,255,.45);

    border-radius:16px;

    padding:8px;

    height:64px;

    cursor:pointer;

    transition:.25s;

}


.calendar-day:hover{

    background:
    rgba(239,68,68,.18);

    transform:
    translateY(-3px);

    box-shadow:
    0 10px 25px rgba(0,0,0,.12);

}



/* Ngày hôm nay */
.calendar-today{

    background:
    rgba(59,130,246,.22);

    border:
    2px solid #3b82f6;

}



/* Ngày chọn */
.calendar-selected{

    background:
    linear-gradient(
        135deg,
        #ef4444,
        #f97316
    );

    color:white;

    transform:
    scale(1.05);

    box-shadow:
    0 10px 25px rgba(239,68,68,.35);

}



/* Số ngày dương */
.day-solar{

    font-size:16px;

    font-weight:800;

}



/* Ngày âm */
.day-lunar{

    font-size:11px;

    color:#64748b;

    text-align:right;

}



/* Khung thông tin ngày */
#selectedDayInfo{

    background:
    rgba(255,255,255,.22);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:
    1px solid rgba(255,255,255,.4);

    border-radius:22px;

    padding:14px;

    box-shadow:
    0 15px 35px rgba(0,0,0,.12);

}



/* Hai cột thông tin */
.glass-box{

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.35),
        rgba(255,255,255,.15)
    );


    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);


    border:
    1px solid rgba(255,255,255,.45);


    border-radius:18px;


    padding:12px;


    box-shadow:

    inset 0 0 20px rgba(255,255,255,.25),
    0 10px 25px rgba(0,0,0,.08);

}



/* Lễ dương */
.glass-red{

    background:
    rgba(239,68,68,.18);

    color:#dc2626;

    border:
    1px solid rgba(239,68,68,.3);

    border-radius:12px;

    padding:7px 10px;

    font-weight:700;

}



/* Lễ âm */
.glass-orange{

    background:
    rgba(249,115,22,.18);

    color:#ea580c;

    border:
    1px solid rgba(249,115,22,.3);

    border-radius:12px;

    padding:7px 10px;

    font-weight:700;

}

/*================ HOÀNG ĐẠO =================*/

.glass-green{
    background:rgba(34,197,94,.18);
    color:#16a34a;
    border:1px solid rgba(34,197,94,.3);
    border-radius:12px;
    padding:7px 10px;
    font-weight:700;
}

.glass-gray{
    background:rgba(107,114,128,.15);
    color:#475569;
    border-radius:12px;
    padding:7px 10px;
    font-weight:700;
}

.glass-gray{
background:rgba(100,116,139,.18);
color:#475569;
border:1px solid rgba(100,116,139,.3);
border-radius:12px;
padding:7px 10px;
font-weight:700;
}

/* Sao đánh dấu ngày */
.day-star{
    color:#f59e0b;
    font-size:12px;
}

/* Tiết khí */
.glass-blue{

    background:
    rgba(59,130,246,.18);

    color:#2563eb;

    border-radius:12px;

    padding:7px 10px;

}



/* Dấu ngày lễ trên lịch */
.calendar-holiday{

    font-size:11px;

    color:#dc2626;

    text-align:center;

}



/* Nút chuyển tháng */
.calendar-btn{

    background:
    rgba(255,255,255,.3);


    backdrop-filter:blur(12px);


    border:
    1px solid rgba(255,255,255,.4);


    border-radius:14px;


    padding:8px 14px;


    transition:.25s;

}


.calendar-btn:hover{

    background:
    rgba(255,255,255,.7);

    transform:
    scale(1.05);

}



/* Animation */
@keyframes calendarShow{

from{

    opacity:0;

    transform:
    translateY(20px)
    scale(.95);

}

to{

    opacity:1;

    transform:
    translateY(0)
    scale(1);

}

}
    </style>

<!-- Menu Emoji + Icon + Symbol -->

<!-- Chèn ảnh -->
<input
    type="file"
    id="imageInput"
    class="hidden"
    accept="image/*"
    onchange="insertImage(this)">

<button
    onclick="document.getElementById('imageInput').click()"
    class="w-10 h-10 flex items-center justify-center
           text-blue-400 hover:text-blue-500 active:text-blue-600 transition-all"
    title="Chèn ảnh">

    <i class="fa-solid fa-images text-lg"></i>

</button>
<!-- Đính kèm mọi loại file -->
<input
    type="file"
    id="fileAttachmentInput"
    class="hidden"
    accept="*/*"

<button
    onclick="document.getElementById('fileAttachmentInput').click()"

           text-teal-500 hover:text-teal-600 active:text-teal-700 transition-all"

</button>

</button>

            <i class="fa-solid fa-qrcode text-purple-600"></i>

            </button>

            </button>

        </div>

        <button onclick="closeQR()" class="mt-3 w-full bg-gray-200 rounded-xl p-2">

    </div>

</div>
<!-- ================= Barcode ================= -->
<div id="barcodeModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center">

    <div class="bg-white rounded-3xl p-6 w-96 shadow-xl">

        <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <i class="fa-solid fa-barcode text-blue-600"></i>
            Tạo Barcode
        </h2>

        <input id="barcodeText"
               class="w-full border rounded-xl p-2 mb-3"
               placeholder="Nhập mã">

        <select id="barcodeType"
                class="w-full border rounded-xl p-2 mb-3">
            <option value="CODE128">CODE128</option>
            <option value="EAN13">EAN13</option>
        </select>

        <label class="text-sm text-gray-600">Màu Barcode</label>
        <input id="barcodeColor"
               type="color"
               value="#000000"
               class="w-full h-10 mb-3 rounded-lg border">

        <label class="text-sm text-gray-600">Màu nền</label>
        <input id="barcodeBg"
               type="color"
               value="#ffffff"
               class="w-full h-10 mb-4 rounded-lg border">

        <div class="flex justify-center border rounded-xl bg-gray-50 p-4 mb-4">
            <svg id="barcodeSvg"></svg>
        </div>

        <div class="flex gap-2">

            <button onclick="createBarcode()"
                    class="flex-1 bg-blue-600 text-white rounded-xl p-2 hover:bg-blue-700">
                <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>
                Tạo
            </button>

            <button onclick="downloadBarcode()"
                    class="flex-1 bg-green-600 text-white rounded-xl p-2 hover:bg-green-700">
                <i class="fa-solid fa-download mr-1"></i>
                Tải
            </button>

        </div>

        <button onclick="closeBarcode()"
                class="mt-3 w-full bg-gray-200 hover:bg-gray-300 rounded-xl p-2">
            Đóng
        </button>

const Embed = Quill.import("blots/embed");


class FileAttachmentBlot extends Embed {


    static create(value){

        const node = super.create();


        node.className = "onenote-file-blot";

        node.contentEditable = false;


        node.dataset.name = value.name || "File";

        node.dataset.size = value.size || "";

        node.dataset.url  = value.url || "";



        const ext = (value.name || "")
            .split(".")
            .pop()
            .toLowerCase();



        const icons = {

            pdf:"fa-solid fa-file-pdf text-red-500",

            doc:"fa-solid fa-file-word text-blue-600",
            docx:"fa-solid fa-file-word text-blue-600",

            xls:"fa-solid fa-file-excel text-green-600",
            xlsx:"fa-solid fa-file-excel text-green-600",
            csv:"fa-solid fa-file-excel text-green-600",

            ppt:"fa-solid fa-file-powerpoint text-orange-500",
            pptx:"fa-solid fa-file-powerpoint text-orange-500",

            zip:"fa-solid fa-file-zipper text-yellow-500",
            rar:"fa-solid fa-file-zipper text-yellow-500",
            "7z":"fa-solid fa-file-zipper text-yellow-500",

            mp3:"fa-solid fa-file-audio text-purple-500",
            wav:"fa-solid fa-file-audio text-purple-500",

            mp4:"fa-solid fa-file-video text-pink-500",
            mov:"fa-solid fa-file-video text-pink-500",

            jpg:"fa-solid fa-file-image text-cyan-500",
            jpeg:"fa-solid fa-file-image text-cyan-500",
            png:"fa-solid fa-file-image text-cyan-500",

            html:"fa-brands fa-html5 text-orange-600",
            css:"fa-brands fa-css3-alt text-blue-500",
            js:"fa-brands fa-js text-yellow-500",

            apk:"fa-brands fa-android text-green-600",

            txt:"fa-solid fa-file-lines text-gray-500"

        };


        const iconClass =
            icons[ext] || "fa-solid fa-file text-gray-500";



        node.innerHTML = `

            <div class="onenote-file-icon">

                <i class="${iconClass}"></i>

            </div>


            <div class="onenote-file-info">

                <div class="onenote-file-name">
                    ${value.name}
                </div>


                <div class="onenote-file-size">
                    ${value.size}
                </div>

            </div>

        `;



        // Click tải file

        node.onclick = function(e){

            e.preventDefault();

            e.stopPropagation();


            const url = node.dataset.url;

            const name = node.dataset.name;


            if(!url){

                alert("Không tìm thấy file!");

                return;

            }


            const a = document.createElement("a");


            a.href = url;

            a.download = name;


            document.body.appendChild(a);


            a.click();


            document.body.removeChild(a);

        };



        return node;

    }



    static value(node){

        return {

            name:node.dataset.name,

            size:node.dataset.size,

            url:node.dataset.url

        };

    }


}

function insertFileAttachment(input) {

    if (!input.files || input.files.length === 0) {
        return;
    }


    const file = input.files[0];


    //==============================
    // Format dung lượng file
    //==============================

    let sizeStr = "";

    if (file.size < 1024) {

        sizeStr = file.size + " B";

    } 
    else if (file.size < 1024 * 1024) {

        sizeStr = (file.size / 1024).toFixed(1) + " KB";

    } 
    else if (file.size < 1024 * 1024 * 1024) {

        sizeStr = (file.size / 1024 / 1024).toFixed(1) + " MB";

    } 
    else {

        sizeStr = (file.size / 1024 / 1024 / 1024).toFixed(1) + " GB";

    }



    //==============================
    // Tạo URL tạm cho file
    // Không dùng FileReader Base64
    //==============================

    const fileURL = URL.createObjectURL(file);



    //==============================
    // Vị trí con trỏ Quill
    //==============================

    const range = quill.getSelection(true) || {

        index: quill.getLength()

    };



    //==============================
    // Chèn file vào Quill
    //==============================

    quill.insertEmbed(

        range.index,

        "fileAttachment",

        {

            name: file.name,

            size: sizeStr,

            url: fileURL

        }

    );



    // Xuống dòng sau file

    quill.insertText(

        range.index + 1,

        "\n"

    );


    // Đưa con trỏ xuống sau file

    quill.setSelection(

        range.index + 2

    );



    // Reset input

    input.value = "";

}

    btn.title = icon;

    // Không thêm fa-solid nữa vì icon đã có sẵn prefix

        : `<i class="${icon} ${color}"></i>`;

async function checkReminders() {
    const notes = await getAllNotes();
    const now = new Date();

    notes.forEach(note => {
        if (note.date && !note.deleted) {
            const noteDate = new Date(note.date);

            if (noteDate > now && noteDate - now < 60000) {

                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("⏰ Nhắc nhở", {
                        body: note.title,
                        icon: "https://cdn-icons-png.flaticon.com/512/1827/1827392.png"
                    });
                } else {
                    alert(`⏰ Nhắc nhở: ${note.title}`);
                }

            }
        }
    });
}

setInterval(checkReminders, 30000);

function createBarcode(){

    let text=document.getElementById("barcodeText").value.trim();

    const type=document.getElementById("barcodeType").value;

    const color=document.getElementById("barcodeColor").value;

    const bg=document.getElementById("barcodeBg").value;

    if(!text){
        alert("Nhập dữ liệu.");
        return;
    }

    if(type==="EAN13" && !/^\d{12,13}$/.test(text)){
        alert("EAN13 phải gồm 12 hoặc 13 số.");
        return;
    }

    JsBarcode("#barcodeSvg",text,{
        format:type,
        lineColor:color,
        background:bg,
        width:2,
        height:80,
        margin:10,
        displayValue:true
    });

}
// DÁN HÀM NÀY NGAY TẠI ĐÂY
function downloadBarcode(){

    const svg=document.getElementById("barcodeSvg");

    if(!svg.innerHTML){
        alert("Hãy tạo Barcode trước.");
        return;
    }

    const serializer=new XMLSerializer();

    const source=serializer.serializeToString(svg);

    const img=new Image();

    img.onload=function(){

        const canvas=document.createElement("canvas");

        canvas.width=img.width;

        const a=document.createElement("a");

        a.href=canvas.toDataURL("image/png");

        a.click();

    };

function changeCase(type){

    const range = quill.getSelection();

    if(!range || range.length===0){
        alert("Hãy chọn đoạn văn bản.");
        return;
    }

    let text = quill.getText(range.index, range.length);

switch(type){

    case "upper":
        text = text.toLocaleUpperCase("vi-VN");
        break;

    case "lower":
        text = text.toLocaleLowerCase("vi-VN");
        break;

    case "title":
        text = text.replace(/\S+/g, word =>
            word.charAt(0).toLocaleUpperCase("vi-VN") +
            word.slice(1).toLocaleLowerCase("vi-VN")
        );
        break;

    case "sentence":
        text = text
            .toLocaleLowerCase("vi-VN")
            .replace(/(^\s*\p{L}|[.!?]\s+\p{L})/gu, c => c.toLocaleUpperCase("vi-VN"));
        break;

    case "toggle":
        text = [...text].map(c =>
            c === c.toLocaleUpperCase("vi-VN")
                ? c.toLocaleLowerCase("vi-VN")
                : c.toLocaleUpperCase("vi-VN")
        ).join("");
        break;

}

    quill.deleteText(range.index, range.length);
    quill.insertText(range.index, text);
    quill.setSelection(range.index, text.length);

    document.getElementById("caseMenu").classList.add("hidden");
}

}

async function exportFile(id, type) {

    const notes = await getAllNotes();
    const note = notes.find(n => n.id === id);

    if (!note) return;

    if (type === 'txt') {

        const blob = new Blob(
            [`${note.title}\n\n${note.content.replace(/<[^>]*>/g,'')}`],
            {type:"text/plain;charset=utf-8"}
        );

        const link=document.createElement("a");
        link.href=URL.createObjectURL(blob);
        link.download=`${note.title}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);

    } else {

        const noteDiv=document.querySelector(`[data-id="${id}"]`);

        if(!noteDiv){
            alert("Không tìm thấy ghi chú!");
            return;
        }

        const canvas=await html2canvas(noteDiv,{
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff"
        });

        const img=canvas.toDataURL("image/png");

        const { jsPDF }=window.jspdf;
        const pdf=new jsPDF("p","mm","a4");

        const pageWidth=190;
        const pageHeight=canvas.height*pageWidth/canvas.width;

        pdf.addImage(img,"PNG",10,10,pageWidth,pageHeight);

        pdf.save(`${note.title}.pdf`);
    }

}

async function renderNotes() {

    const searchTerm =
        (document.getElementById('searchInput')?.value || "")
        .toLowerCase()
        .trim();


    const sortVal = window.sortValue || "newest";


    let notes = await getAllNotes();



    //==============================
    // Filter
    //==============================
    notes = notes.filter(n => {

        const matchTrash =
            showTrash ? n.deleted : !n.deleted;


        const searchText =
            (
                (n.title || "") +
                " " +
                (n.content || "").replace(/<[^>]*>/g,"") +
                " " +
                (n.date || "")
            )
            .toLowerCase();


        return matchTrash &&
               searchText.includes(searchTerm);

    });



    //==============================
    // Sort
    //==============================
    switch(sortVal){

        case "newest":
            notes.sort((a,b)=>b.id-a.id);
            break;


        case "oldest":
            notes.sort((a,b)=>a.id-b.id);
            break;


        case "title":
            notes.sort((a,b)=>
                (a.title||"")
                .localeCompare(b.title||"")
            );
            break;


        case "date":
            notes.sort((a,b)=>
                new Date(a.date || "9999") -
                new Date(b.date || "9999")
            );
            break;


        case "color":
            notes.sort((a,b)=>
                (a.bgColor||"")
                .localeCompare(b.bgColor||"")
            );
            break;
    }



    // Pin lên đầu
    notes.sort((a,b)=>
        Number(b.pinned||0) -
        Number(a.pinned||0)
    );



    //==============================
    // Pagination
    //==============================
    const start =
        (currentPage - 1) * notesPerPage;

                    <i class="fa-solid fa-trash"></i>

                </button>

                </div>

            </div>

            <p class="text-xs text-gray-400 mb-4 font-medium italic">

                ${
                n.date
                ?
                `
                <i class="fa-solid fa-calendar-days"></i>
                ${n.date}
                |
                ${getLunarDate(n.date)}
                `
                :
                "Không có ngày hẹn"
                }

            </p>

            <div class="text-gray-700 ql-editor p-0">

                ${n.content || ""}

            </div>

        </div>

    `).join("")
    }

    `;

    //==================================================
    // Gắn lại sự kiện click cho File Attachment
    //==================================================
    container.querySelectorAll(".onenote-file-blot").forEach(blot => {

        blot.onclick = function (e) {

            e.preventDefault();
            e.stopPropagation();

            const url = blot.getAttribute("data-url");
            const name = blot.getAttribute("data-name");

            if (!url) return;

            const link = document.createElement("a");
            link.href = url;
            link.download = name || "file";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

        };

    });

    renderPagination(notes.length);

    updateStats();

}


function renderPagination(total){

    const count=Math.ceil(total/notesPerPage)||1;

    if(currentPage>count) currentPage=count;

    let html="";

    const addPage=p=>{
        html+=`<button onclick="currentPage=${p};renderNotes()" class="px-3 py-1 border rounded ${currentPage===p?'bg-blue-600 text-white':''}">${p}</button>`;
    };

    if(count<=10){

        for(let i=1;i<=count;i++) addPage(i);

    }else{

        addPage(1);

        if(currentPage>4)
            html+=`<span class="px-2">...</span>`;

        const start=Math.max(2,currentPage-1);
        const end=Math.min(count-1,currentPage+1);

        for(let i=start;i<=end;i++)
            addPage(i);

        if(currentPage<count-3)
            html+=`<span class="px-2">...</span>`;

        addPage(count);

    }

    const pagination=document.getElementById("pagination");

    if(pagination)
        pagination.innerHTML=html;

}
    </script>
</body>
