    <script>
        // --- IndexedDB Logic ---
        let db;
        const request = indexedDB.open("NotesDB", 1);
        request.onupgradeneeded = e => { db = e.target.result; db.createObjectStore("notes", { keyPath: "id" }); };
        request.onsuccess=async e=>{db=e.target.result;if("Notification"in window&&Notification.permission==="default")await Notification.requestPermission();renderNotes();checkReminders();};

        const dbAction = (mode, callback) => {
            const tx = db.transaction("notes", mode);
            const store = tx.objectStore("notes");
            return new Promise(resolve => {
                const req = callback(store);
                req.onsuccess = () => resolve(req.result);
                tx.oncomplete = () => {};
            });
        };

        const getAllNotes = () => dbAction("readonly", s => s.getAll());
        const saveNotesToDB = (notes) => {
            const tx = db.transaction("notes", "readwrite");
            const store = tx.objectStore("notes");
            store.clear();
            notes.forEach(n => store.put(n));
        };
        // -----------------------

        const toolbarOptions=[[{'header':['1','2','3',false]}],[{'size':['small',false,'large','huge']}],['bold','italic','underline','strike'],[{'script':'sub'},{'script':'super'}],[{'color':[]},{'background':[]}],[{'align':[]}],[{'list':'ordered'},{'list':'bullet'}],['link','image']];
        const quill = new Quill('#editor', { theme: 'snow', modules: { toolbar: toolbarOptions } });
        const datePickerInstance = flatpickr("#datePicker", { enableTime: true, dateFormat: "Y-m-d H:i" });
        let editingId = null;
        let showTrash = false;
        let viewMode = 'grid';

        const container = document.getElementById('notesContainer');
        new Sortable(container, { animation: 150, onEnd: updateOrder });

        function toggleView(mode) { viewMode = mode; renderNotes(); }

        async function updateStats() {
            const notes = await getAllNotes();
            const now = new Date();
            const activeNotes = notes.filter(n => !n.deleted);
            
            const stats = {
                total: activeNotes.length,
                scheduled: activeNotes.filter(n => n.date).length,
                overdue: activeNotes.filter(n => n.date && new Date(n.date) < now).length,
                pinned: activeNotes.filter(n => n.pinned).length
            };

            const statsContainer = document.getElementById('statsContainer');
            statsContainer.innerHTML = `
                <div class="bg-blue-50 p-4 rounded-2xl flex items-center gap-3 border border-blue-100">
                    <i class="fa-solid fa-note-sticky text-blue-500 text-xl"></i>
                    <div><div class="text-xs text-gray-500">Tổng ghi chú</div><div class="font-bold">${stats.total}</div></div>
                </div>
                <div class="bg-purple-50 p-4 rounded-2xl flex items-center gap-3 border border-purple-100">
                    <i class="fa-solid fa-calendar-check text-purple-500 text-xl"></i>
                    <div><div class="text-xs text-gray-500">Có lịch</div><div class="font-bold">${stats.scheduled}</div></div>
                </div>
                <div class="bg-red-50 p-4 rounded-2xl flex items-center gap-3 border border-red-100">
                    <i class="fa-solid fa-clock text-red-500 text-xl"></i>
                    <div><div class="text-xs text-gray-500">Quá hạn</div><div class="font-bold">${stats.overdue}</div></div>
                </div>
                <div class="bg-yellow-50 p-4 rounded-2xl flex items-center gap-3 border border-yellow-100">
                    <i class="fa-solid fa-thumbtack text-yellow-500 text-xl"></i>
                    <div><div class="text-xs text-gray-500">Đã ghim</div><div class="font-bold">${stats.pinned}</div></div>
                </div>
            `;
        }

async function checkReminders() {
    const notes = await getAllNotes();
    const now = new Date();

    notes.forEach(note => {
        if (note.date && !note.deleted) {
            const noteDate = new Date(note.date);

            if (noteDate > now && noteDate - now < 60000) {

                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("⏰ Nhắc nhở", {
                        body: note.title,
                        icon: "https://cdn-icons-png.flaticon.com/512/1827/1827392.png"
                    });
                } else {
                    alert(`⏰ Nhắc nhở: ${note.title}`);
                }

            }
        }
    });
}

setInterval(checkReminders, 30000);

        async function updateOrder() {
            let notes = await getAllNotes();
            const items = Array.from(container.children);
            const newOrder = items.map(item => parseInt(item.dataset.id));
            const reordered = newOrder.map(id => notes.find(n => n.id === id)).filter(n => n);
            const others = notes.filter(n => !newOrder.includes(n.id));
            saveNotesToDB([...reordered, ...others]);
        }

        function setFontSize(val) {

function toggleCaseMenu(){

function changeCase(type){

    const range = quill.getSelection();

    if(!range || range.length===0){
        alert("Hãy chọn đoạn văn bản.");
        return;
    }

    let text = quill.getText(range.index, range.length);

switch(type){

    case "upper":
        text = text.toLocaleUpperCase("vi-VN");
        break;

    case "lower":
        text = text.toLocaleLowerCase("vi-VN");
        break;

    case "title":
        text = text.replace(/\S+/g, word =>
            word.charAt(0).toLocaleUpperCase("vi-VN") +
            word.slice(1).toLocaleLowerCase("vi-VN")
        );
        break;

    case "sentence":
        text = text
            .toLocaleLowerCase("vi-VN")
            .replace(/(^\s*\p{L}|[.!?]\s+\p{L})/gu, c => c.toLocaleUpperCase("vi-VN"));
        break;

    case "toggle":
        text = [...text].map(c =>
            c === c.toLocaleUpperCase("vi-VN")
                ? c.toLocaleLowerCase("vi-VN")
                : c.toLocaleUpperCase("vi-VN")
        ).join("");
        break;

}

    quill.deleteText(range.index, range.length);
    quill.insertText(range.index, text);
    quill.setSelection(range.index, text.length);

    document.getElementById("caseMenu").classList.add("hidden");
}

function insertImage(input){
    const file=input.files[0];
    if(!file)return;

    const reader=new FileReader();

    reader.onload=e=>{
        const range=quill.getSelection();
        quill.insertEmbed(range?range.index:quill.getLength(),'image',e.target.result);
    };

    reader.readAsDataURL(file);
}

        let currentPage = 1;
        const notesPerPage = 10;
        function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
function getLunarDate(dateString) {
    if (!dateString) return '';
    const d = new Date(dateString);
    if (isNaN(d)) return '';
    const l = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, d.getDate()).getLunar();
    return `Âm Lịch: Ngày ${l.getDay()} Tháng ${l.getMonth()}`;
}

        async function saveNote() {
            const title = document.getElementById('title').value;
            const content = quill.root.innerHTML;
            const date = document.getElementById('datePicker').value;
            const bgColor = document.getElementById('bgColor').value;
            const fontSize = document.getElementById('fontSize').value;
            if(!title) return alert("Vui lòng nhập tiêu đề!");
            
            let notes = await getAllNotes();
            if (editingId) {
                notes=notes.map(n=>n.id===editingId?{...n,title,content,date,bgColor,fontSize,reminded:false,updated:new Date().toISOString()}:n);
            } else {
                notes.unshift({id:Date.now(),title,content,date,bgColor,fontSize,deleted:false,pinned:false,reminded:false,created:new Date().toISOString(),updated:new Date().toISOString()});
            }
            saveNotesToDB(notes);
            resetForm();
            renderNotes();
        }

        async function editNote(id) {
            const notes = await getAllNotes();
            const note = notes.find(n => n.id === id);
            if (!note) return;
            editingId = id;
            document.getElementById('title').value = note.title;
            quill.root.innerHTML = note.content;
            document.getElementById('datePicker').value = note.date;
            datePickerInstance.setDate(note.date);
            document.getElementById('bgColor').value = note.bgColor;
            document.getElementById('fontSize').value = note.fontSize;
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-check"></i> Cập nhật';
            document.getElementById('cancelBtn').classList.remove('hidden');
        }

        function resetForm() {
            editingId = null;
            document.getElementById('title').value = '';
            quill.setContents([]);
            datePickerInstance.clear();
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Lưu';
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('fontSize').value = 'text-base';
        }

        function toggleTrash() { showTrash = !showTrash; renderNotes(); }

        async function togglePin(id) {
            let notes = await getAllNotes();
            notes = notes.map(n => n.id === id ? {...n, pinned: !n.pinned} : n);
            saveNotesToDB(notes);
            renderNotes();
        }

}

function changeSort(value){

    document.getElementById("sortMenu").classList.add("hidden");

    document.getElementById("sortSelect")?.remove();

    window.sortValue=value;

    renderNotes();
}

        async function deleteNote(id) {
            let notes = await getAllNotes();
            if (showTrash) {
                if(!confirm('Xóa vĩnh viễn ghi chú này?')) return;
                notes = notes.filter(n => n.id !== id);
            } else {
                notes = notes.map(n => n.id === id ? {...n, deleted: true} : n);
            }
            saveNotesToDB(notes);
            renderNotes();
        }

        async function restoreNote(id) {
            let notes = await getAllNotes();
            notes = notes.map(n => n.id === id ? {...n, deleted: false} : n);
            saveNotesToDB(notes);
            renderNotes();
        }

async function exportFile(id, type) {

    const notes = await getAllNotes();
    const note = notes.find(n => n.id === id);

    if (!note) return;

    if (type === 'txt') {

        const blob = new Blob(
            [`${note.title}\n\n${note.content.replace(/<[^>]*>/g,'')}`],
            {type:"text/plain;charset=utf-8"}
        );

        const link=document.createElement("a");
        link.href=URL.createObjectURL(blob);
        link.download=`${note.title}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);

    } else {

        const noteDiv=document.querySelector(`[data-id="${id}"]`);

        if(!noteDiv){
            alert("Không tìm thấy ghi chú!");
            return;
        }

        const canvas=await html2canvas(noteDiv,{
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff"
        });

        const img=canvas.toDataURL("image/png");

        const { jsPDF }=window.jspdf;
        const pdf=new jsPDF("p","mm","a4");

        const pageWidth=190;
        const pageHeight=canvas.height*pageWidth/canvas.width;

        pdf.addImage(img,"PNG",10,10,pageWidth,pageHeight);

        pdf.save(`${note.title}.pdf`);
    }

}

        async function renderNotes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
           const sortVal = window.sortValue || "newest";
            let notes = await getAllNotes();
            
            notes=notes.filter(n=>(showTrash?n.deleted:!n.deleted)&&(((n.title||"")+" "+(n.content||"").replace(/<[^>]*>/g,"")+" "+(n.date||"")).toLowerCase().includes(searchTerm)));
            
            if (sortVal === 'newest') notes.sort((a, b) => b.id - a.id);
            if (sortVal === 'oldest') notes.sort((a, b) => a.id - b.id);
            if (sortVal === 'title') notes.sort((a, b) => a.title.localeCompare(b.title));
            if (sortVal === 'date') notes.sort((a, b) => new Date(a.date || '9999') - new Date(b.date || '9999'));
            if (sortVal === 'color') notes.sort((a, b) => a.bgColor.localeCompare(b.bgColor));
            
            notes.sort((a, b) => b.pinned - a.pinned);
            
            const start = (currentPage - 1) * notesPerPage;
            const paginated = notes.slice(start, start + notesPerPage);
            
            container.className = viewMode === 'grid' ? 'grid grid-cols-1 md:grid-cols-2 gap-4' : 'grid grid-cols-1 gap-4';
            container.innerHTML = paginated.map(n => `
                <div data-id="${n.id}" class="p-5 border rounded-3xl ${n.fontSize} cursor-move" style="background-color: ${n.bgColor}">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-lg">${capitalize(n.title)}</h3>
                        <div class="flex gap-2">
                            ${!n.deleted ? `
                                <button onclick="togglePin(${n.id})" class="${n.pinned ? 'text-yellow-500' : 'text-gray-400'}"><i class="fa-solid fa-thumbtack"></i></button>
                                <button onclick="exportFile(${n.id}, 'pdf')" class="text-red-600"><i class="fa-solid fa-file-pdf"></i></button>
                                <button onclick="exportFile(${n.id}, 'txt')" class="text-gray-600"><i class="fa-solid fa-file-lines"></i></button>
                                <button onclick="editNote(${n.id})" class="text-blue-500"><i class="fa-solid fa-pen-to-square"></i></button>
                            ` : `<button onclick="restoreNote(${n.id})" class="text-green-500"><i class="fa-solid fa-trash-arrow-up"></i></button>`}
                            <button onclick="deleteNote(${n.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 mb-4 font-medium italic">
                        ${n.date ? `<i class="fa-solid fa-calendar-days"></i> ${n.date} | ${getLunarDate(n.date)}` : 'Không có ngày hẹn'}
                    </p>
                    <div class="text-gray-700 ql-editor p-0">${n.content}</div>
                </div>
            `).join('');
            
            renderPagination(notes.length);
            updateStats();
        }

function renderPagination(total){

    const count=Math.ceil(total/notesPerPage)||1;

    if(currentPage>count) currentPage=count;

    let html="";

    const addPage=p=>{
        html+=`<button onclick="currentPage=${p};renderNotes()" class="px-3 py-1 border rounded ${currentPage===p?'bg-blue-600 text-white':''}">${p}</button>`;
    };

    if(count<=10){

        for(let i=1;i<=count;i++) addPage(i);

    }else{

        addPage(1);

        if(currentPage>4)
            html+=`<span class="px-2">...</span>`;

        const start=Math.max(2,currentPage-1);
        const end=Math.min(count-1,currentPage+1);

        for(let i=start;i<=end;i++)
            addPage(i);

        if(currentPage<count-3)
            html+=`<span class="px-2">...</span>`;

        addPage(count);

    }

    const pagination=document.getElementById("pagination");

    if(pagination)
        pagination.innerHTML=html;

}
    </script>
