        // --- IndexedDB Logic ---
        let db;
        const request = indexedDB.open("NotesDB", 1);
        request.onupgradeneeded = e => { db = e.target.result; db.createObjectStore("notes", { keyPath: "id" }); };
        request.onsuccess=async e=>{db=e.target.result;if("Notification"in window&&Notification.permission==="default")await Notification.requestPermission();renderNotes();checkReminders();};

        const dbAction = (mode, callback) => {
            const tx = db.transaction("notes", mode);
            const store = tx.objectStore("notes");
            return new Promise(resolve => {
                const req = callback(store);
                req.onsuccess = () => resolve(req.result);
                tx.oncomplete = () => {};
            });
        };

        const getAllNotes = () => dbAction("readonly", s => s.getAll());
        const saveNotesToDB = (notes) => {
            const tx = db.transaction("notes", "readwrite");
            const store = tx.objectStore("notes");
            store.clear();
            notes.forEach(n => store.put(n));

async function checkReminders() {

            if (noteDate > now && noteDate - now < 60000) {

                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("⏰ Nhắc nhở", {
                        body: note.title,
                        icon: "https://cdn-icons-png.flaticon.com/512/1827/1827392.png"
                    });
                } else {
                    alert(`⏰ Nhắc nhở: ${note.title}`);
                }

            }
        }
    });
}

// DÁN HÀM NÀY NGAY TẠI ĐÂY
function downloadBarcode(){

    const svg=document.getElementById("barcodeSvg");

    if(!svg.innerHTML){
        alert("Hãy tạo Barcode trước.");
        return;
    }

    const serializer=new XMLSerializer();

    const source=serializer.serializeToString(svg);

    const img=new Image();

    img.onload=function(){

        const canvas=document.createElement("canvas");

        canvas.width=img.width;

        canvas.height=img.height;

        const ctx=canvas.getContext("2d");

        // Nên lấy màu nền đang chọn
        ctx.fillStyle=document.getElementById("barcodeBg").value;

        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.drawImage(img,0,0);

        const a=document.createElement("a");

        a.download="Barcode.png";

        a.href=canvas.toDataURL("image/png");

        a.click();

    };

    img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(source)));

}

function toggleCaseMenu(){

function changeCase(type){

    const range = quill.getSelection();

    if(!range || range.length===0){
        alert("Hãy chọn đoạn văn bản.");
        return;
    }

    let text = quill.getText(range.index, range.length);

switch(type){

    case "upper":
        text = text.toLocaleUpperCase("vi-VN");
        break;

    case "lower":
        text = text.toLocaleLowerCase("vi-VN");
        break;

    case "title":
        text = text.replace(/\S+/g, word =>
            word.charAt(0).toLocaleUpperCase("vi-VN") +
            word.slice(1).toLocaleLowerCase("vi-VN")
        );
        break;

    case "sentence":
        text = text
            .toLocaleLowerCase("vi-VN")
            .replace(/(^\s*\p{L}|[.!?]\s+\p{L})/gu, c => c.toLocaleUpperCase("vi-VN"));
        break;

    case "toggle":
        text = [...text].map(c =>
            c === c.toLocaleUpperCase("vi-VN")
                ? c.toLocaleLowerCase("vi-VN")
                : c.toLocaleUpperCase("vi-VN")
        ).join("");
        break;

}

    quill.deleteText(range.index, range.length);
    quill.insertText(range.index, text);
    quill.setSelection(range.index, text.length);

    document.getElementById("caseMenu").classList.add("hidden");
}

}

function getLunarDate(dateString) {
    if (!dateString) return '';
    const d = new Date(dateString);
    if (isNaN(d)) return '';
    const l = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, d.getDate()).getLunar();
    return `Âm Lịch: Ngày ${l.getDay()} Tháng ${l.getMonth()}`;
}

        async function saveNote() {
            const title = document.getElementById('title').value;
            const content = quill.root.innerHTML;
            const date = document.getElementById('datePicker').value;
            const bgColor = document.getElementById('bgColor').value;
            const fontSize = document.getElementById('fontSize').value;
            if(!title) return alert("Vui lòng nhập tiêu đề!");
            
            let notes = await getAllNotes();
            if (editingId) {
                notes=notes.map(n=>n.id===editingId?{...n,title,content,date,bgColor,fontSize,reminded:false,updated:new Date().toISOString()}:n);
            } else {
                notes.unshift({id:Date.now(),title,content,date,bgColor,fontSize,deleted:false,pinned:false,reminded:false,created:new Date().toISOString(),updated:new Date().toISOString()});
            }
            saveNotesToDB(notes);
            resetForm();
            renderNotes();
        }

async function exportFile(id, type) {

    const notes = await getAllNotes();
    const note = notes.find(n => n.id === id);

    if (!note) return;

    if (type === 'txt') {

        const blob = new Blob(
            [`${note.title}\n\n${note.content.replace(/<[^>]*>/g,'')}`],
            {type:"text/plain;charset=utf-8"}
        );

        const link=document.createElement("a");
        link.href=URL.createObjectURL(blob);
        link.download=`${note.title}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);

    } else {

        const noteDiv=document.querySelector(`[data-id="${id}"]`);

        if(!noteDiv){
            alert("Không tìm thấy ghi chú!");
            return;
        }

        const canvas=await html2canvas(noteDiv,{
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff"
        });

        const img=canvas.toDataURL("image/png");

        const { jsPDF }=window.jspdf;
        const pdf=new jsPDF("p","mm","a4");

        const pageWidth=190;
        const pageHeight=canvas.height*pageWidth/canvas.width;

        pdf.addImage(img,"PNG",10,10,pageWidth,pageHeight);

        pdf.save(`${note.title}.pdf`);
    }

}

        async function renderNotes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
           const sortVal = window.sortValue || "newest";
            let notes = await getAllNotes();
            
            notes=notes.filter(n=>(showTrash?n.deleted:!n.deleted)&&(((n.title||"")+" "+(n.content||"").replace(/<[^>]*>/g,"")+" "+(n.date||"")).toLowerCase().includes(searchTerm)));
            
            if (sortVal === 'newest') notes.sort((a, b) => b.id - a.id);
            if (sortVal === 'oldest') notes.sort((a, b) => a.id - b.id);
            if (sortVal === 'title') notes.sort((a, b) => a.title.localeCompare(b.title));
            if (sortVal === 'date') notes.sort((a, b) => new Date(a.date || '9999') - new Date(b.date || '9999'));
            if (sortVal === 'color') notes.sort((a, b) => a.bgColor.localeCompare(b.bgColor));
            
            notes.sort((a, b) => b.pinned - a.pinned);
            
            const start = (currentPage - 1) * notesPerPage;
            const paginated = notes.slice(start, start + notesPerPage);
            
            container.className = viewMode === 'grid' ? 'grid grid-cols-1 md:grid-cols-2 gap-4' : 'grid grid-cols-1 gap-4';
            container.innerHTML = paginated.map(n => `
                <div data-id="${n.id}" class="p-5 border rounded-3xl ${n.fontSize} cursor-move" style="background-color: ${n.bgColor}">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-lg">${capitalize(n.title)}</h3>
                        <div class="flex gap-2">
                            ${!n.deleted ? `
                                <button onclick="togglePin(${n.id})" class="${n.pinned ? 'text-yellow-500' : 'text-gray-400'}"><i class="fa-solid fa-thumbtack"></i></button>
                                <button onclick="exportFile(${n.id}, 'pdf')" class="text-red-600"><i class="fa-solid fa-file-pdf"></i></button>
                                <button onclick="exportFile(${n.id}, 'txt')" class="text-gray-600"><i class="fa-solid fa-file-lines"></i></button>
                                <button onclick="editNote(${n.id})" class="text-blue-500"><i class="fa-solid fa-pen-to-square"></i></button>
                            ` : `<button onclick="restoreNote(${n.id})" class="text-green-500"><i class="fa-solid fa-trash-arrow-up"></i></button>`}
                            <button onclick="deleteNote(${n.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 mb-4 font-medium italic">
                        ${n.date ? `<i class="fa-solid fa-calendar-days"></i> ${n.date} | ${getLunarDate(n.date)}` : 'Không có ngày hẹn'}
                    </p>
                    <div class="text-gray-700 ql-editor p-0">${n.content}</div>
                </div>
            `).join('');
            
            renderPagination(notes.length);
            updateStats();
        }

function renderPagination(total){

    const count=Math.ceil(total/notesPerPage)||1;

    if(currentPage>count) currentPage=count;

    let html="";

    const addPage=p=>{
        html+=`<button onclick="currentPage=${p};renderNotes()" class="px-3 py-1 border rounded ${currentPage===p?'bg-blue-600 text-white':''}">${p}</button>`;
    };

    if(count<=10){

        for(let i=1;i<=count;i++) addPage(i);

    }else{

        addPage(1);

        if(currentPage>4)
            html+=`<span class="px-2">...</span>`;

        const start=Math.max(2,currentPage-1);
        const end=Math.min(count-1,currentPage+1);

        for(let i=start;i<=end;i++)
            addPage(i);

        if(currentPage<count-3)
            html+=`<span class="px-2">...</span>`;

        addPage(count);

    }

    const pagination=document.getElementById("pagination");

    if(pagination)
        pagination.innerHTML=html;

}
